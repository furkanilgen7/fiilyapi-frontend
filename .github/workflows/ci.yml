name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı dala arka arkaya commit atıldığında ESKİ turlar iptal edilir.
# Şef oturumları bir dilimde 6-10 commit atıyor; bu blok olmadan her biri tam
# turu (build ~9 dk + visual ~8 dk) sonuna kadar koşuyordu — hâlbuki yalnız EN
# SON commit'in sonucu anlamlı. Kapsam kaybı YOK: iptal edilen tur zaten
# geçersiz kılınmış bir ağacı ölçüyordu.
# `main` HARİÇ TUTULUR (`github.run_id` benzersiz olduğu için grup çakışmaz):
# main'e inen bir tur, sonraki merge yüzünden iptal edilmemelidir — canlıya
# giden kodun ölçümü her zaman tamamlanır.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm surumu package.json'daki "packageManager" alanindan okunur;
      # burada "version" belirtmek "Multiple versions of pnpm" hatasi verir.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      # F-MK bulgusu: `reporter` CI'da "github" olduğu için `playwright-report/`
      # HİÇ üretilmiyordu → başarısızlıkta BOŞ artifact yükleniyor, görsel kırığın
      # `-actual`/`-diff` kareleri hiç elde edilemiyordu. O kareler `test-results/`
      # altında yaşar; ikisi birden yüklenir (`playwright-report/` html reporter'a
      # geçilirse diye korunur, `if-no-files-found: ignore` ile).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
